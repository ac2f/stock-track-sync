# Entegrasyon testleri: merkez ve yerel sunucu için iki AYRI PostgreSQL 16.
# Sunucular (stock-track/backend) ve ajan testten süreç olarak başlatılır —
# böylece test onları istediği anda öldürüp yeniden başlatabilir (kaos).
#   docker compose -f test/integration/docker-compose.test.yml up -d --wait
name: stocktrack-sync-test
services:
  primary-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stocktrack
      POSTGRES_PASSWORD: stocktrack
      POSTGRES_DB: postgres
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - '127.0.0.1:${TEST_PRIMARY_DB_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stocktrack']
      interval: 2s
      timeout: 3s
      retries: 30

  replica-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stocktrack
      POSTGRES_PASSWORD: stocktrack
      POSTGRES_DB: postgres
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - '127.0.0.1:${TEST_REPLICA_DB_PORT:-55433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stocktrack']
      interval: 2s
      timeout: 3s
      retries: 30
